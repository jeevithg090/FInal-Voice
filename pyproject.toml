[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-tamil-rocm-trainer"
version = "0.1.0"
description = "One-command Piper TTS fine-tuning for Tamil on AMD ROCm GPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "shellcheck-py>=0.10", "shfmt-py>=3.7"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
# Nothing to package: this project ships shell + standalone scripts.
# pyproject.toml exists to pin dev tooling and configure ruff/pytest.
py-modules = []
